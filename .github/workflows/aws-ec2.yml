name: RescueKaro CI and AWS deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:proxy

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify Docker is available for database integration tests
        run: docker info > /dev/null
      - name: Test and package backend
        working-directory: backend
        run: bash mvnw --batch-mode --no-transfer-progress verify

  deploy:
    needs: [frontend, backend]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    concurrency:
      group: rescuekaro-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check deployment settings
        run: |
          test -n "$AWS_REGION"
          test -n "$AWS_ROLE_ARN"
          [[ "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]+$ ]]
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: rescuekaro-${{ github.run_id }}
      - name: Send deployment to EC2
        id: command
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, re
          sha = os.environ['DEPLOY_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', sha)
          script = base64.b64encode(pathlib.Path('scripts/deploy-ec2.sh').read_bytes()).decode()
          command = f"printf '%s' '{script}' | base64 -d | runuser -u ec2-user -- bash -s -- '{sha}'"
          pathlib.Path('ssm-parameters.json').write_text(json.dumps({
              'commands': [command], 'executionTimeout': ['2400']
          }))
          PY
          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "RescueKaro deployment $GITHUB_SHA" \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' --output text)
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
      - name: Wait for deployment result
        env:
          COMMAND_ID: ${{ steps.command.outputs.command_id }}
        run: |
          # Run Command is eventually consistent and builds may take minutes.
          for attempt in $(seq 1 270); do
            if ! result=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
              --output json 2>ssm-error.txt); then
              if grep -q InvocationDoesNotExist ssm-error.txt; then
                sleep 10
                continue
              fi
              cat ssm-error.txt >&2
              exit 1
            fi
            status=$(printf '%s' "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin)["Status"])')
            case "$status" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *)
                printf '%s' "$result" | python3 -c 'import json,sys; r=json.load(sys.stdin); print(r.get("StandardOutputContent", "")); print(r.get("StandardErrorContent", ""), file=sys.stderr)'
                test "$status" = Success
                exit $?
                ;;
            esac
          done
          echo 'Timed out waiting. Inspect the SSM command before running another deployment.' >&2
          exit 1
