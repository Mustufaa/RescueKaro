name: rescuekaro-supabase

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL:?Set Supabase session-pooler JDBC URL in the root .env file}
      DB_USERNAME: ${DB_USERNAME:?Set Supabase pooler username in the root .env file}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:?Set OTP_HASH_SECRET in the root .env file}
      API_PROXY_IP_SECRET: ${API_PROXY_IP_SECRET:?Set API_PROXY_IP_SECRET in the root .env file}
      EMAIL_PROVIDER: resend
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY in the root .env file}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM in the root .env file}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:?Set public frontend HTTPS origin in the root .env file}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set exact frontend origin in the root .env file}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-5}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-0}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      API_INTERNAL_BASE_URL: http://backend:8080
      API_PROXY_IP_SECRET: ${API_PROXY_IP_SECRET:?Set API_PROXY_IP_SECRET in the root .env file}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
