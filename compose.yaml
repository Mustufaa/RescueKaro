name: rescuekaro

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-rescuekaro_db}
      POSTGRES_USER: ${LOCAL_DB_USERNAME:-rescuekaro}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD for the local database, or use -f compose.supabase.yaml for Supabase}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-rescuekaro_db}
      DB_USERNAME: ${LOCAL_DB_USERNAME:-rescuekaro}
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD for the local database, or use -f compose.supabase.yaml for Supabase}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:?Set OTP_HASH_SECRET in the root .env file}
      API_PROXY_IP_SECRET: ${API_PROXY_IP_SECRET:?Set API_PROXY_IP_SECRET in the root .env file}
      EMAIL_PROVIDER: resend
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY in the root .env file}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM in the root .env file}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DB_POOL_MAX_SIZE: 5
      DB_POOL_MIN_IDLE: 0
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      API_INTERNAL_BASE_URL: http://backend:8080
      API_PROXY_IP_SECRET: ${API_PROXY_IP_SECRET:?Set API_PROXY_IP_SECRET in the root .env file}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
