name: rescuekaro

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-rescuekaro_db}
      POSTGRES_USER: ${DB_USERNAME:-rescuekaro}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rescuekaro_db}
      DB_USERNAME: ${DB_USERNAME:-rescuekaro}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:${FRONTEND_PORT:-3000}}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      OTP_PROVIDER: ${OTP_PROVIDER:-mock}
      OTP_TEST_CODE: ${OTP_TEST_CODE:-000111}
      RAZORPAY_MODE: ${RAZORPAY_MODE:-simulation}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      SPRING_MAIL_HOST: ${SMTP_HOST:-}
      SPRING_MAIL_PORT: ${SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend:/workspace
      - backend_target:/workspace/target
      - maven_repository:/root/.m2
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: 1
      WATCHPACK_POLLING: "true"
      API_INTERNAL_BASE_URL: http://backend:8080/api/v1
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_APP_URL:-http://localhost:${FRONTEND_PORT:-3000}}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  backend_target:
  maven_repository:
  frontend_node_modules:
  frontend_next_cache:
