# Preview configuration. Free instances are unsuitable for production emergency QR availability.
services:
  - type: web
    name: rescuekaro-backend
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: RENDER_DATABASE_URL
        fromDatabase:
          name: rescuekaro-db
          property: connectionString
      - key: RENDER_FRONTEND_HOST
        fromService:
          name: rescuekaro-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_HASH_SECRET
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_FROM_NAME
        value: RescueKaro
      - key: SMTP_AUTH
        value: "true"
      - key: SMTP_STARTTLS
        value: "true"
      - key: SMTP_STARTTLS_REQUIRED
        value: "true"
      - key: SMTP_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: SMTP_READ_TIMEOUT_MS
        value: "5000"
      - key: SMTP_WRITE_TIMEOUT_MS
        value: "5000"

  - type: web
    name: rescuekaro-frontend
    runtime: node
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -H 0.0.0.0 -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_INTERNAL_BASE_URL
        # Free web services cannot receive private network traffic.
        # Use the backend's public HTTPS hostname for this preview Blueprint.
        fromService:
          name: rescuekaro-backend
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME

databases:
  - name: rescuekaro-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: rescuekaro_db
    user: rescuekaro
