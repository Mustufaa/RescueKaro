spring:
  application:
    name: rescuekaro-backend
  config:
    # Support a git-ignored local env file whether Maven is started from the
    # repository root or from backend/. OS environment variables still win.
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rescuekaro_db}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:3000}
  public-app-url: ${PUBLIC_APP_URL:http://localhost:3000}
  security:
    jwt-secret: ${JWT_SECRET:dev-only-change-this-secret-before-production-32chars}
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
  otp:
    provider: ${OTP_PROVIDER:mock}
    development-code: ${OTP_TEST_CODE:${DEV_OTP_CODE:000111}}
    expiry-seconds: 300
    resend-seconds: 30
    max-attempts: 5
